    <body class="bg-custom-body bg-custom-body-image">

    
    <div class="container bg-custom-beige rounded mb-3 col-md-10" style="max-width: 900px;">
    <div class="color-overlay">
          <main class="auth-shell">
    <section class="auth-card">
      <!-- <div class="brand">Product Admin</div> -->
      <h1>Buat Akun</h1>
      <!-- <p class="subtitle">Create an account for the admin area.</p> -->

      <form id="registerForm" class="auth-form">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Nama Kamu" required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" required>

        <button type="submit">Register</button>
        <p id="message" class="form-message"></p>
      </form>

      <p class="auth-footer">Sudah Punya Akun? <a href="login.html">Login</a></p>
    </section>
  </main>
